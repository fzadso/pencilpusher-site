# Cindy's editing page (Decap CMS) at /admin
backend:
  name: github
  repo: fzadso/pencilpusher-site
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Remove {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://thepencilpusher.net
display_url: https://thepencilpusher.net
logo:
  src: /assets/admin-logo.svg
  show_in_header: true
show_preview_links: true
locale: en

media_folder: src/uploads
public_folder: /uploads

collections:
  - name: art
    label: Artwork
    label_singular: Artwork
    description: "Click New Artwork to add a piece. Click a piece to change its price or mark it sold. Tip: the grid button at the top right shows your art as pictures."
    folder: src/art
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "art/{{slug}}/"
    sortable_fields:
      - { field: date, label: "Newest", default_sort: desc }
      - { field: title, label: "Title" }
      - { field: medium, label: "Medium" }
    view_filters:
      - { label: "Pencil", field: medium, pattern: Pencil }
      - { label: "Acrylic", field: medium, pattern: Acrylic }
      - { label: "Sold", field: sold, pattern: true }
    view_groups:
      - { label: "Medium", field: medium }
    summary: "{{title}} · {{medium}}{{sold | ternary(' · SOLD', '')}}"
    fields:
      - { label: "Photo", name: image, widget: image, choose_url: false, hint: "Click to upload a photo from your computer. Any size works; the website shrinks it. Use .jpg or .png photos." }
      - { label: "Title", name: title, widget: string }
      - { label: "Pencil or acrylic?", name: medium, widget: select, options: [Pencil, Acrylic], default: Pencil, hint: "Decides which tab it appears under in the Shop." }
      - { label: "Size", name: size, widget: string, required: false, hint: "Width × height, for example: 16 × 20 (inches are assumed)" }
      - { label: "Price of the original ($)", name: original_price, widget: number, value_type: int, required: false, hint: "Just the number, like 950. Leave empty if the original isn't for sale." }
      - { label: "The original is SOLD", name: sold, widget: boolean, default: false, hint: "Switch on when the original sells. It stays on the site with a Sold tag, and prints can still be bought." }
      - { label: "Sell prints", name: prints_available, widget: boolean, default: true }
      - { label: "Print price ($)", name: print_price, widget: number, value_type: int, default: 50, required: false, hint: "Prints are the same size as the original. Raise or lower it any time." }
      - { label: "Year made (optional)", name: year, widget: number, value_type: int, required: false }
      - { label: "A few words about this piece (optional)", name: body, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], hint: "Shows on the piece's own page." }
      - { label: "Date added", name: date, widget: datetime, default: "{{now}}", hint: "Newest pieces show first. You can leave this alone." }

  - name: pages
    label: Pages & settings
    description: "Your About text, the Commissions page, and shipping prices."
    editor: { preview: false }
    files:
      - name: home
        label: "Home page gallery"
        file: src/_data/home.json
        fields:
          - label: "Pictures on the home page, in order"
            name: gallery
            label_singular: "picture"
            widget: list
            hint: "The FIRST one shows large when someone visits. Drag the ☰ handles to change the order. Click Add to put another piece in, or the X to take one out (that only removes it from the home page, not from the shop)."
            add_to_top: false
            field:
              label: "Artwork"
              name: piece
              widget: relation
              collection: art
              value_field: "{{slug}}"
              search_fields: [title]
              display_fields: ["{{title}} ({{medium}})"]
          - { label: "Banner across the top (optional)", name: banner, widget: image, required: false, hint: "A wide image like your logo banner. Leave empty for no banner." }
          - { label: "Describe the banner", name: banner_alt, widget: string, required: false }
          - label: "Also show new pieces automatically"
            name: add_new_automatically
            widget: boolean
            default: true
            hint: "On: any piece not in the list above still appears, after your picks, newest first. Off: only the pieces in your list appear."
      - name: about
        label: "About me (home page)"
        file: src/_data/about.json
        fields:
          - { label: "Heading", name: heading, widget: string }
          - { label: "Photo (optional)", name: photo, widget: image, required: false }
          - { label: "Describe the photo", name: photo_alt, widget: string, required: false, hint: "For people using screen readers, e.g. “Cindy's drawing of herself drawing her reflection in a pond”" }
          - { label: "About text", name: body, widget: text, hint: "Leave a blank line between paragraphs." }
          - label: "Quick facts"
            name: stats
            widget: list
            fields:
              - { label: "Big number or words", name: number, widget: string }
              - { label: "Label", name: label, widget: string }
      - name: commissions
        label: "Commissions page"
        file: src/_data/commissions.json
        fields:
          - { label: "Opening sentence", name: intro, widget: text }
          - { label: "Subjects", name: subjects, widget: list, hint: "Short words, separated by commas" }
          - { label: "How pricing works", name: pricing, widget: text, hint: "Leave a blank line between paragraphs." }
          - { label: "Steps", name: steps, widget: list, field: { label: Step, name: step, widget: string } }
          - { label: "Poster (optional)", name: poster, widget: image, required: false, hint: "Shown beside 'How pricing works'. Visitors can tap it to see it full size." }
          - { label: "Describe the poster", name: poster_alt, widget: text, required: false, hint: "For screen readers: what's on it, including any prices." }
          - { label: "Sample agreement (PDF)", name: sample_agreement, widget: hidden }
          - label: "Questions people ask"
            name: faq
            widget: list
            label_singular: "question"
            required: false
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Answer", name: answer, widget: text }
          - label: "Sample commissions"
            name: samples
            widget: list
            fields:
              - { label: "Photo", name: image, widget: image }
              - { label: "Caption", name: caption, widget: string }
      - name: settings
        label: "Shop & contact settings"
        file: src/_data/settings.json
        fields:
          - { label: "Website name", name: site_name, widget: string }
          - { label: "Your name", name: artist, widget: string }
          - { label: "Web address", name: url, widget: hidden }
          - { label: "Short tagline", name: tagline, widget: string }
          - { label: "Description for Google", name: description, widget: text, hint: "One or two sentences. Mention what you draw and Boise, Idaho." }
          - { label: "City", name: city, widget: string }
          - { label: "State", name: region, widget: string }
          - { label: "Email shown on the Contact page", name: contact_email, widget: string }
          - { label: "Default print price ($)", name: print_price_default, widget: number, value_type: int, hint: "Used when a piece has no print price filled in." }
          - { label: "Shipping for prints ($)", name: shipping_print, widget: number, value_type: int }
          - { label: "Shipping when an original is in the order ($)", name: shipping_original, widget: number, value_type: int }
          - { label: "Local pickup note", name: pickup_note, widget: string }
          - { label: "Shipping & returns policy", name: shipping_returns, widget: text, hint: "Shown on the cart page and on each artwork's page. Leave a blank line between paragraphs." }
          - { label: "Print size note", name: print_note, widget: string }
          - { label: "Show the newsletter signup on the Contact page", name: show_newsletter, widget: boolean, default: false, required: false, hint: "Leave off until you have a way to send newsletters." }
          - { label: "Instagram link", name: instagram, widget: string, required: false }
          - { label: "Facebook link", name: facebook, widget: string, required: false }
